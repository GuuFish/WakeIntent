name: Feature request
description: Propose a focused engine, adapter, or evaluation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What contact-decision problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Example timeline
      description: Show the conversation and the expected contact/defer/cancel/expire/silent/resolve outcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why a reminder, scheduler, memory lookup, or host-level policy is insufficient.
